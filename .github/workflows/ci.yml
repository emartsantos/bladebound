name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  NODE_VERSION: 22

jobs:
  verify:
    name: Lint, type-check, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Packages (game-engine has pre-existing src/combat.ts type errors that are
      # parked; it is covered by its passing unit suite instead.)
      - name: Type-check packages
        run: |
          npm run typecheck --workspace @premium-rpg/shared-types
          npm run typecheck --workspace @premium-rpg/validation
          npm run typecheck --workspace @premium-rpg/game-data
          npm run typecheck --workspace @premium-rpg/ui-tokens
          npm run typecheck --workspace @premium-rpg/utilities
          npm run typecheck --workspace @premium-rpg/telemetry

      - name: Type-check web app
        run: npm run typecheck --workspace web

      - name: Lint web app
        run: npm run lint --workspace web

      - name: Unit tests (game-engine, validation)
        run: |
          npm test --workspace @premium-rpg/game-engine
          npm test --workspace @premium-rpg/validation

      - name: Unit tests (telemetry: events, updates, live-ops, retention)
        run: npm test --workspace @premium-rpg/telemetry

      - name: Unit tests (mobile)
        run: npm test --workspace @premium-rpg/mobile

      - name: Bundle check (mobile, Android export)
        run: npx expo export --platform android --output-dir dist-export
        working-directory: apps/mobile

  web-e2e:
    name: Web E2E (Phase 39 six categories)
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - name: Run E2E suite
        run: npm run test:e2e --workspace web
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 14

  web-build:
    name: Web production build
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build --workspace web