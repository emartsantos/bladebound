<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="Iron sword">
  <!-- Dark Fantasy Etching: flat ink-wash, no gradients -->
  <rect x="0" y="0" width="64" height="64" fill="#131110"/>
  <!-- blade -->
  <path d="M32 4 L40 26 L32 38 L24 26 Z" fill="#2c2a26"/>
  <!-- ember edge highlight -->
  <path d="M40 26 L32 38 L33.5 34 L38 27 Z" fill="#d4692f"/>
  <!-- bronze crossguard -->
  <rect x="22" y="38" width="20" height="4" fill="#c9a264"/>
  <!-- grip -->
  <rect x="30" y="42" width="4" height="14" fill="#1a1816"/>
  <!-- pommel -->
  <circle cx="32" cy="59" r="3" fill="#e6dcc2"/>
  <!-- bone glint dot -->
  <circle cx="30" cy="12" r="1.4" fill="#e6dcc2"/>
</svg>